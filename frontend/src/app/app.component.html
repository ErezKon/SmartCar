<mat-sidenav-container class="app-container" [hasBackdrop]="isMobile">
  <mat-sidenav #sidenav [mode]="isMobile ? 'push' : 'side'" [opened]="!isMobile" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">directions_car</mat-icon>
      <span class="app-title">Smartcar</span>
    </div>
    <div class="provider-toggle">
      <mat-button-toggle-group [value]="activeProvider" (change)="onProviderChange($event.value)" class="provider-group">
        <mat-button-toggle value="saic">SAIC</mat-button-toggle>
        <mat-button-toggle value="smartcar">Smartcar</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <mat-nav-list>
      <a mat-list-item *ngFor="let item of navItems"
         [routerLink]="item.path"
         routerLinkActive="active-link"
         (click)="onNavClick()"
         class="nav-item">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">MG4 Smart Control</span>
      <span class="toolbar-spacer"></span>
      <app-vehicle-selector *ngIf="activeProvider === 'smartcar'"></app-vehicle-selector>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
