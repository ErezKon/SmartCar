<mat-card class="info-card stats-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>speed</mat-icon>
    <mat-card-title>Driving Stats</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="info-row">
      <span class="label">Mileage Today</span>
      <span class="value">{{ mileageToday }}</span>
    </div>
    <div class="info-row">
      <span class="label">Energy Today</span>
      <span class="value">{{ energyToday }}</span>
    </div>
    <div class="info-row">
      <span class="label">Since Last Charge</span>
      <span class="value">{{ mileageSinceCharge }}</span>
    </div>
    <div class="info-row">
      <span class="label">Energy Since Charge</span>
      <span class="value">{{ energySinceCharge }}</span>
    </div>
    <div class="info-row" *ngIf="lightsStatus">
      <span class="label">Lights</span>
      <span class="value">
        <span *ngIf="lightsStatus.mainBeam">Main </span>
        <span *ngIf="lightsStatus.dippedBeam">Dipped </span>
        <span *ngIf="lightsStatus.sideLight">Side</span>
        <span *ngIf="!lightsStatus.mainBeam && !lightsStatus.dippedBeam && !lightsStatus.sideLight">Off</span>
      </span>
    </div>
  </mat-card-content>
</mat-card>
