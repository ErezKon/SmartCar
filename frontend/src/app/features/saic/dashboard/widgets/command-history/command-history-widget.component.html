<mat-card class="info-card history-card wide-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>history</mat-icon>
    <mat-card-title>Command History</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <button mat-stroked-button (click)="loadCommandLogs.emit()" class="load-history-btn">
      <mat-icon>refresh</mat-icon> Load History
    </button>
    <table mat-table [dataSource]="commandLogs" *ngIf="commandLogs.length > 0" class="log-table">
      <ng-container matColumnDef="command">
        <th mat-header-cell *matHeaderCellDef>Command</th>
        <td mat-cell *matCellDef="let log">{{ log.command }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let log">
          <app-status-badge [status]="log.status" size="small"></app-status-badge>
        </td>
      </ng-container>
      <ng-container matColumnDef="duration_ms">
        <th mat-header-cell *matHeaderCellDef>Duration</th>
        <td mat-cell *matCellDef="let log">{{ log.duration_ms ? log.duration_ms + 'ms' : 'N/A' }}</td>
      </ng-container>
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Time</th>
        <td mat-cell *matCellDef="let log">{{ log.created_at }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="logColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: logColumns;"></tr>
    </table>
    <div *ngIf="commandLogs.length === 0" class="empty-state">
      <p>No command history yet.</p>
    </div>
  </mat-card-content>
</mat-card>
